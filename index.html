<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>テープの長さをはかろう</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background:#eaf6ff;
  color:#17212b;
  font-family:"UD デジタル 教科書体 N-R","Hiragino Sans","Yu Gothic",sans-serif;
  touch-action:manipulation;
}

button,input{
  font:inherit;
}

button{
  border:none;
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:8px 12px 10px;
}

.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px;
}

h1{
  margin:0;
  color:#176aab;
  font-size:clamp(26px,3vw,39px);
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.progress{
  min-width:112px;
  padding:8px 13px;
  border:3px solid #60a9d8;
  border-radius:14px;
  background:#fff;
  color:#175f96;
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.reset-button{
  min-height:46px;
  padding:7px 15px;
  border-radius:14px;
  background:#fff;
  color:#176aab;
  font-size:17px;
  font-weight:900;
  box-shadow:0 4px 0 #b5d5e8;
}

.reset-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #b5d5e8;
}

.instruction{
  flex:0 0 auto;
  margin:0 0 6px;
  padding:7px 14px;
  border-radius:14px;
  background:#fff;
  font-size:clamp(17px,1.9vw,23px);
  font-weight:900;
  text-align:center;
}

.main{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  border:4px solid #78bce8;
  border-radius:20px;
  background:#fff;
}

.problem-number{
  position:absolute;
  top:9px;
  left:11px;
  z-index:5;
  min-width:65px;
  height:48px;
  padding:0 10px;
  display:grid;
  place-items:center;
  border:4px solid #17212b;
  border-radius:24px;
  background:#fff;
  font-size:23px;
  font-weight:900;
}

.tape-area{
  position:relative;
  z-index:2;
  width:min(1100px,96%);
  margin:54px auto 0;
}

.tape-row{
  display:grid;
  grid-template-columns:105px minmax(250px,1fr) 270px;
  align-items:center;
  gap:14px;
  min-height:92px;
}

.tape-label{
  font-size:21px;
  font-weight:900;
  text-align:center;
}

.tape-track{
  position:relative;
  height:72px;
  display:flex;
  align-items:center;
}

.start-line{
  position:absolute;
  left:0;
  top:7px;
  width:4px;
  height:58px;
  background:#273b49;
}

.tape{
  position:relative;
  height:46px;
  border:3px solid;
  box-shadow:0 4px 8px rgba(0,0,0,.15);
}

.tape::before,
.tape::after{
  content:"";
  position:absolute;
  top:-3px;
  width:8px;
  height:calc(100% + 6px);
  background:
    linear-gradient(
      135deg,
      transparent 0 20%,
      currentColor 21% 31%,
      transparent 32% 47%,
      currentColor 48% 58%,
      transparent 59% 74%,
      currentColor 75% 85%,
      transparent 86%
    );
}

.tape::before{
  left:-6px;
}

.tape::after{
  right:-6px;
  transform:scaleX(-1);
}

.tape1{
  color:#d83d73;
  border-color:#d83d73;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.85) 0 4px,
      transparent 5px
    ),
    #ff9fc0;
  background-size:28px 28px;
}

.tape2{
  color:#168ac8;
  border-color:#168ac8;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.45) 0 8px,
      transparent 8px 18px
    ),
    #83d8fa;
}

.answer-box{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  font-size:27px;
  font-weight:900;
  white-space:nowrap;
}

input{
  width:110px;
  height:70px;
  border:4px solid #283a48;
  border-radius:14px;
  background:#fff;
  font-size:40px;
  font-weight:900;
  text-align:center;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
}

input:focus{
  border-color:#1684d1;
  box-shadow:0 0 0 5px rgba(22,132,209,.15);
}

.calculation{
  position:relative;
  z-index:2;
  width:fit-content;
  margin:4px auto 0;
  padding:9px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  border:3px solid #f6c445;
  border-radius:16px;
  background:#fff9da;
  font-size:25px;
  font-weight:900;
}

.ruler-home{
  position:absolute;
  left:20px;
  right:20px;
  bottom:14px;
  height:145px;
  border:3px dashed #a7c8dd;
  border-radius:16px;
  background:#f2faff;
}

.ruler-home-text{
  margin:7px 0 0;
  color:#5e7788;
  font-size:17px;
  font-weight:900;
  text-align:center;
}

.ruler{
  position:absolute;
  z-index:50;
  height:116px;
  overflow:hidden;
  border:4px solid #296d9f;
  border-radius:7px;
  background:
    linear-gradient(
      to bottom,
      rgba(232,249,255,.86),
      rgba(168,218,245,.70)
    );
  box-shadow:
    0 9px 18px rgba(0,0,0,.27),
    inset 0 0 0 2px rgba(255,255,255,.75);
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.ruler.dragging{
  cursor:grabbing;
  box-shadow:
    0 13px 25px rgba(0,0,0,.34),
    inset 0 0 0 2px rgba(255,255,255,.75);
}

.tick{
  position:absolute;
  top:0;
  width:2px;
  background:#111820;
  transform:translateX(-50%);
  pointer-events:none;
}

.tick.mm{
  height:25px;
}

.tick.half{
  width:2.5px;
  height:38px;
}

.tick.cm{
  width:3px;
  height:54px;
}

.ruler-number{
  position:absolute;
  top:58px;
  color:#101820;
  font-size:23px;
  font-weight:900;
  transform:translateX(-50%);
  pointer-events:none;
}

.ruler-unit{
  position:absolute;
  left:42px;
  bottom:8px;
  color:#145f93;
  font-size:17px;
  font-weight:900;
  pointer-events:none;
}

.buttons{
  flex:0 0 auto;
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:7px;
}

.action-button{
  min-width:190px;
  min-height:52px;
  padding:7px 20px;
  border-radius:15px;
  font-size:22px;
  font-weight:900;
}

.check-button{
  color:#fff;
  background:#1686d3;
  box-shadow:0 5px 0 #0b5d97;
}

.next-button{
  color:#352700;
  background:#ffd34f;
  box-shadow:0 5px 0 #c99b00;
}

.next-button:disabled{
  color:#777;
  background:#ddd;
  box-shadow:0 5px 0 #aaa;
  cursor:default;
}

.action-button:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}

.result{
  flex:0 0 auto;
  min-height:32px;
  margin-top:3px;
  font-size:22px;
  font-weight:900;
  text-align:center;
}

.correct-message{
  color:#df285d;
}

.wrong-message{
  color:#176fae;
}

.correct-input{
  border-color:#38a747!important;
  background:#def8dc!important;
}

.wrong-input{
  border-color:#2674c5!important;
  background:#ddebff!important;
}

.judge-mark{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.judge-mark.show{
  display:flex;
  animation:judgePop .7s ease forwards;
}

.circle-mark{
  width:min(42vw,330px);
  aspect-ratio:1;
  border:clamp(24px,4vw,42px) solid #e62246;
  border-radius:50%;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
}

.cross-mark{
  position:relative;
  width:min(42vw,330px);
  aspect-ratio:1;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
}

.cross-mark::before,
.cross-mark::after{
  content:"";
  position:absolute;
  left:45%;
  top:0;
  width:11%;
  height:100%;
  border-radius:18px;
  background:#1976d2;
}

.cross-mark::before{
  transform:rotate(45deg);
}

.cross-mark::after{
  transform:rotate(-45deg);
}

@keyframes judgePop{
  0%{
    opacity:0;
    transform:scale(.4);
  }

  30%{
    opacity:1;
    transform:scale(1.12);
  }

  75%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}

.congratulations{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.96),
      rgba(255,241,160,.97)
    );
}

.congratulations.show{
  display:flex;
}

.congratulations-card{
  position:relative;
  width:min(820px,94vw);
  max-height:92vh;
  overflow:hidden;
  padding:24px 28px 28px;
  border:8px solid #ffbd24;
  border-radius:34px;
  background:#fff;
  box-shadow:0 16px 35px rgba(0,0,0,.28);
  text-align:center;
}

.congratulations-card::before,
.congratulations-card::after{
  content:"★　★　★";
  position:absolute;
  color:#ffcf33;
  font-size:34px;
  letter-spacing:12px;
}

.congratulations-card::before{
  top:15px;
  left:25px;
  transform:rotate(-12deg);
}

.congratulations-card::after{
  right:25px;
  bottom:20px;
  transform:rotate(12deg);
}

.congratulations-title{
  position:relative;
  z-index:2;
  margin:0;
  color:#e83268;
  font-size:clamp(45px,8vw,82px);
  line-height:1.15;
  text-shadow:
    3px 3px 0 #fff,
    6px 6px 0 #ffd154;
}

.congratulations-picture{
  position:relative;
  z-index:2;
  width:min(430px,70vw);
  margin:8px auto 5px;
}

.congratulations-message{
  position:relative;
  z-index:2;
  margin:0 0 17px;
  color:#176aab;
  font-size:clamp(24px,4vw,38px);
  font-weight:900;
}

.restart-button{
  position:relative;
  z-index:3;
  min-width:220px;
  min-height:58px;
  padding:10px 24px;
  border-radius:18px;
  background:#ffcf42;
  color:#3a2a00;
  font-size:24px;
  font-weight:900;
  box-shadow:0 6px 0 #c49200;
}

.restart-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #c49200;
}

@media(max-width:900px){
  .app{
    padding:7px 8px 8px;
  }

  h1{
    font-size:25px;
  }

  .header-right{
    gap:6px;
  }

  .progress{
    min-width:92px;
    padding:7px 8px;
    font-size:17px;
  }

  .reset-button{
    padding:6px 9px;
    font-size:15px;
  }

  .tape-area{
    width:97%;
  }

  .tape-row{
    grid-template-columns:76px minmax(150px,1fr) 230px;
    gap:7px;
    min-height:88px;
  }

  .tape-label{
    font-size:17px;
  }

  .answer-box{
    gap:8px;
    font-size:22px;
  }

  input{
    width:92px;
    height:62px;
    font-size:35px;
  }

  .calculation{
    gap:7px;
    padding:7px 10px;
    font-size:21px;
  }

  .ruler{
    height:108px;
  }

  .ruler-home{
    height:134px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <h1>
      テープの長さをはかろう
    </h1>

    <div class="header-right">

      <div
        class="progress"
        id="progress"
      >
        1 / 10
      </div>

      <button
        type="button"
        class="reset-button"
        id="resetRulerButton"
      >
        定規をもどす
      </button>

    </div>

  </header>

  <p class="instruction">
    定規の0をテープの左端に合わせて、長さをはかりましょう。
  </p>

  <main
    class="main"
    id="main"
  >

    <div
      class="problem-number"
      id="problemNumber"
    >
      1もんめ
    </div>

    <section class="tape-area">

      <div class="tape-row">

        <div class="tape-label">
          テープ①
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape1"
            id="tape1"
          ></div>

        </div>

        <label class="answer-box">

          長さ

          <input
            type="number"
            inputmode="numeric"
            id="answer1"
          >

          cm

        </label>

      </div>

      <div class="tape-row">

        <div class="tape-label">
          テープ②
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape2"
            id="tape2"
          ></div>

        </div>

        <label class="answer-box">

          長さ

          <input
            type="number"
            inputmode="numeric"
            id="answer2"
          >

          cm

        </label>

      </div>

    </section>

    <div class="calculation">

      <input
        type="number"
        inputmode="numeric"
        id="calc1"
      >

      <span>cm</span>

      <span>＋</span>

      <input
        type="number"
        inputmode="numeric"
        id="calc2"
      >

      <span>cm</span>

      <span>＝</span>

      <input
        type="number"
        inputmode="numeric"
        id="total"
      >

      <span>cm</span>

    </div>

    <div class="ruler-home">

      <p class="ruler-home-text">
        定規を動かして、テープの上に重ねてください。
      </p>

    </div>

    <div
      class="ruler"
      id="ruler"
    >

      <div id="rulerScale"></div>

      <div class="ruler-unit">
        cm
      </div>

    </div>

  </main>

  <div class="buttons">

    <button
      type="button"
      class="action-button check-button"
      id="checkButton"
    >
      こたえあわせ
    </button>

    <button
      type="button"
      class="action-button next-button"
      id="nextButton"
      disabled
    >
      つぎのもんだい
    </button>

  </div>

  <div
    class="result"
    id="result"
    aria-live="polite"
  ></div>

</div>

<div
  class="judge-mark"
  id="correctMark"
>
  <div class="circle-mark"></div>
</div>

<div
  class="judge-mark"
  id="wrongMark"
>
  <div class="cross-mark"></div>
</div>

<div
  class="congratulations"
  id="congratulations"
>

  <div class="congratulations-card">

    <h2 class="congratulations-title">
      おめでとう！
    </h2>

    <svg
      class="congratulations-picture"
      viewBox="0 0 600 330"
      role="img"
      aria-label="お祝いの画像"
    >

      <defs>

        <linearGradient
          id="rainbow"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop offset="0%" stop-color="#ff4b6e"/>
          <stop offset="25%" stop-color="#ffbd35"/>
          <stop offset="50%" stop-color="#55c96b"/>
          <stop offset="75%" stop-color="#4b9fea"/>
          <stop offset="100%" stop-color="#9c61e8"/>
        </linearGradient>

      </defs>

      <path
        d="M105 250 A195 195 0 0 1 495 250"
        fill="none"
        stroke="url(#rainbow)"
        stroke-width="45"
        stroke-linecap="round"
      />

      <ellipse
        cx="300"
        cy="275"
        rx="180"
        ry="28"
        fill="#d8f2ff"
      />

      <path
        d="M250 235 L270 165 L300 215 L330 165 L350 235 Z"
        fill="#ffd83d"
        stroke="#e39800"
        stroke-width="7"
      />

      <circle cx="300" cy="170" r="14" fill="#ff4b6e"/>
      <circle cx="270" cy="150" r="14" fill="#4b9fea"/>
      <circle cx="330" cy="150" r="14" fill="#55c96b"/>

      <circle
        cx="300"
        cy="255"
        r="72"
        fill="#ffcf56"
        stroke="#e49b00"
        stroke-width="7"
      />

      <circle cx="276" cy="244" r="7" fill="#323232"/>
      <circle cx="324" cy="244" r="7" fill="#323232"/>

      <path
        d="M274 274 Q300 298 326 274"
        fill="none"
        stroke="#d94f5c"
        stroke-width="8"
        stroke-linecap="round"
      />

      <path
        d="M180 215 L193 242 L223 246 L201 267 L207 297 L180 283 L153 297 L159 267 L137 246 L167 242 Z"
        fill="#ff5b86"
      />

      <path
        d="M420 215 L433 242 L463 246 L441 267 L447 297 L420 283 L393 297 L399 267 L377 246 L407 242 Z"
        fill="#55b7ff"
      />

    </svg>

    <p class="congratulations-message">
      10もん ぜんぶ せいかい！
    </p>

    <button
      type="button"
      class="restart-button"
      id="restartButton"
    >
      もういちど
    </button>

  </div>

</div>

<script>
"use strict";

const PIXELS_PER_CM = 52;
const RULER_LENGTH_CM = 10;

const RULER_LEFT_MARGIN = 22;
const RULER_RIGHT_MARGIN = 22;

const problems = [
  {a:3,b:2},
  {a:4,b:3},
  {a:5,b:2},
  {a:6,b:3},
  {a:7,b:2},
  {a:5,b:4},
  {a:6,b:4},
  {a:7,b:3},
  {a:8,b:2},
  {a:8,b:1}
];

let currentProblem = 0;
let problemCleared = false;
let markTimer = null;

const main =
  document.getElementById("main");

const ruler =
  document.getElementById("ruler");

const rulerScale =
  document.getElementById("rulerScale");

const problemNumber =
  document.getElementById("problemNumber");

const progress =
  document.getElementById("progress");

const tape1 =
  document.getElementById("tape1");

const tape2 =
  document.getElementById("tape2");

const answer1 =
  document.getElementById("answer1");

const answer2 =
  document.getElementById("answer2");

const calc1 =
  document.getElementById("calc1");

const calc2 =
  document.getElementById("calc2");

const total =
  document.getElementById("total");

const result =
  document.getElementById("result");

const correctMark =
  document.getElementById("correctMark");

const wrongMark =
  document.getElementById("wrongMark");

const congratulations =
  document.getElementById("congratulations");

const resetRulerButton =
  document.getElementById("resetRulerButton");

const checkButton =
  document.getElementById("checkButton");

const nextButton =
  document.getElementById("nextButton");

const restartButton =
  document.getElementById("restartButton");

function makeRuler(){

  ruler.style.width =
    RULER_LEFT_MARGIN +
    RULER_LENGTH_CM * PIXELS_PER_CM +
    RULER_RIGHT_MARGIN +
    "px";

  rulerScale.innerHTML = "";

  for(
    let millimeter = 0;
    millimeter <= RULER_LENGTH_CM * 10;
    millimeter++
  ){

    const x =
      RULER_LEFT_MARGIN +
      millimeter * PIXELS_PER_CM / 10;

    const tick =
      document.createElement("div");

    tick.style.left =
      x + "px";

    if(millimeter % 10 === 0){

      tick.className =
        "tick cm";

      const number =
        document.createElement("div");

      number.className =
        "ruler-number";

      number.style.left =
        x + "px";

      number.textContent =
        String(millimeter / 10);

      rulerScale.appendChild(number);

    }else if(millimeter % 5 === 0){

      tick.className =
        "tick half";

    }else{

      tick.className =
        "tick mm";

    }

    rulerScale.appendChild(tick);

  }

}

function resetRuler(){

  const left =
    Math.max(
      8,
      (main.clientWidth - ruler.offsetWidth) / 2
    );

  const top =
    Math.max(
      8,
      main.clientHeight -
      ruler.offsetHeight -
      23
    );

  ruler.style.left =
    left + "px";

  ruler.style.top =
    top + "px";

}

function clearInputStyles(){

  [
    answer1,
    answer2,
    calc1,
    calc2,
    total
  ].forEach(function(input){

    input.classList.remove(
      "correct-input",
      "wrong-input"
    );

  });

}

function clearInputs(){

  [
    answer1,
    answer2,
    calc1,
    calc2,
    total
  ].forEach(function(input){

    input.value = "";

  });

  clearInputStyles();

  result.textContent = "";
  result.className = "result";

  problemCleared = false;

  nextButton.disabled = true;
  checkButton.disabled = false;

}

function showProblem(){

  const problem =
    problems[currentProblem];

  problemNumber.textContent =
    currentProblem + 1 + "もんめ";

  progress.textContent =
    currentProblem + 1 +
    " / " +
    problems.length;

  tape1.style.width =
    problem.a * PIXELS_PER_CM + "px";

  tape2.style.width =
    problem.b * PIXELS_PER_CM + "px";

  clearInputs();
  resetRuler();

}

function markInput(
  input,
  correct
){

  input.classList.remove(
    "correct-input",
    "wrong-input"
  );

  input.classList.add(
    correct
      ? "correct-input"
      : "wrong-input"
  );

}

function showJudgeMark(
  markElement
){

  clearTimeout(markTimer);

  correctMark.classList.remove("show");
  wrongMark.classList.remove("show");

  void markElement.offsetWidth;

  markElement.classList.add("show");

  markTimer = setTimeout(function(){

    markElement.classList.remove("show");

  },720);

}

function checkAnswers(){

  if(problemCleared){
    return;
  }

  const problem =
    problems[currentProblem];

  const inputs = [
    answer1,
    answer2,
    calc1,
    calc2,
    total
  ];

  const allEntered =
    inputs.every(function(input){

      return input.value.trim() !== "";

    });

  if(!allEntered){

    clearInputStyles();
    showJudgeMark(wrongMark);

    result.textContent =
      "まだ書いていないところがあります。";

    result.className =
      "result wrong-message";

    return;

  }

  const checks = [
    Number(answer1.value) === problem.a,
    Number(answer2.value) === problem.b,
    Number(calc1.value) === problem.a,
    Number(calc2.value) === problem.b,
    Number(total.value) === problem.a + problem.b
  ];

  inputs.forEach(function(
    input,
    index
  ){

    markInput(
      input,
      checks[index]
    );

  });

  if(checks.every(Boolean)){

    problemCleared = true;

    showJudgeMark(correctMark);

    result.textContent =
      "せいかい！ じょうずにはかれました！";

    result.className =
      "result correct-message";

    checkButton.disabled = true;

    if(
      currentProblem ===
      problems.length - 1
    ){

      nextButton.disabled = true;

      setTimeout(function(){

        congratulations.classList.add(
          "show"
        );

      },760);

    }else{

      nextButton.disabled = false;

    }

  }else{

    showJudgeMark(wrongMark);

    result.textContent =
      "青いところを、もういちど見なおしましょう。";

    result.className =
      "result wrong-message";

    nextButton.disabled = true;

  }

}

function nextProblem(){

  if(!problemCleared){
    return;
  }

  if(
    currentProblem <
    problems.length - 1
  ){

    currentProblem++;

    showProblem();

  }

}

function restartGame(){

  currentProblem = 0;
  problemCleared = false;

  congratulations.classList.remove(
    "show"
  );

  showProblem();

}

function clearResultAfterInput(){

  if(problemCleared){
    return;
  }

  result.textContent = "";
  result.className = "result";

}

answer1.addEventListener(
  "input",
  function(){

    if(!problemCleared){

      calc1.value =
        answer1.value;

      answer1.classList.remove(
        "correct-input",
        "wrong-input"
      );

      calc1.classList.remove(
        "correct-input",
        "wrong-input"
      );

      clearResultAfterInput();

    }

  }
);

answer2.addEventListener(
  "input",
  function(){

    if(!problemCleared){

      calc2.value =
        answer2.value;

      answer2.classList.remove(
        "correct-input",
        "wrong-input"
      );

      calc2.classList.remove(
        "correct-input",
        "wrong-input"
      );

      clearResultAfterInput();

    }

  }
);

[
  calc1,
  calc2,
  total
].forEach(function(input){

  input.addEventListener(
    "input",
    function(){

      if(!problemCleared){

        input.classList.remove(
          "correct-input",
          "wrong-input"
        );

        clearResultAfterInput();

      }

    }
  );

});

let dragging = false;
let offsetX = 0;
let offsetY = 0;

ruler.addEventListener(
  "pointerdown",
  function(event){

    dragging = true;

    ruler.classList.add(
      "dragging"
    );

    const rect =
      ruler.getBoundingClientRect();

    offsetX =
      event.clientX - rect.left;

    offsetY =
      event.clientY - rect.top;

    try{

      ruler.setPointerCapture(
        event.pointerId
      );

    }catch(error){
    }

    event.preventDefault();

  }
);

ruler.addEventListener(
  "pointermove",
  function(event){

    if(!dragging){
      return;
    }

    const mainRect =
      main.getBoundingClientRect();

    let left =
      event.clientX -
      mainRect.left -
      offsetX;

    let top =
      event.clientY -
      mainRect.top -
      offsetY;

    const maxLeft =
      Math.max(
        0,
        main.clientWidth -
        ruler.offsetWidth
      );

    const maxTop =
      Math.max(
        0,
        main.clientHeight -
        ruler.offsetHeight
      );

    left =
      Math.max(
        0,
        Math.min(maxLeft,left)
      );

    top =
      Math.max(
        0,
        Math.min(maxTop,top)
      );

    ruler.style.left =
      left + "px";

    ruler.style.top =
      top + "px";

    event.preventDefault();

  }
);

function stopDragging(
  event
){

  if(!dragging){
    return;
  }

  dragging = false;

  ruler.classList.remove(
    "dragging"
  );

  try{

    ruler.releasePointerCapture(
      event.pointerId
    );

  }catch(error){
  }

}

ruler.addEventListener(
  "pointerup",
  stopDragging
);

ruler.addEventListener(
  "pointercancel",
  stopDragging
);

resetRulerButton.addEventListener(
  "click",
  resetRuler
);

checkButton.addEventListener(
  "click",
  checkAnswers
);

nextButton.addEventListener(
  "click",
  nextProblem
);

restartButton.addEventListener(
  "click",
  restartGame
);

window.addEventListener(
  "resize",
  function(){

    requestAnimationFrame(
      resetRuler
    );

  }
);

document.addEventListener(
  "dblclick",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);

document.addEventListener(
  "gesturestart",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);

makeRuler();

requestAnimationFrame(
  showProblem
);
</script>

</body>
</html>
