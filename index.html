<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no"
>
<title>テープの長さをはかろう</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #eaf6ff;
  color: #17212b;
  font-family:
    "UD デジタル 教科書体 N-R",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: none;
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 10px 14px 12px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  color: #176aab;
  font-size: clamp(27px, 3vw, 40px);
}

.reset-button {
  min-height: 48px;
  padding: 8px 16px;
  border-radius: 14px;
  background: #ffffff;
  color: #176aab;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 4px 0 #b5d5e8;
}

.reset-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #b5d5e8;
}

.instruction {
  margin: 0 0 8px;
  padding: 9px 14px;
  border-radius: 14px;
  background: #ffffff;
  font-size: clamp(18px, 2vw, 25px);
  font-weight: 900;
  text-align: center;
}

.main {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border: 4px solid #78bce8;
  border-radius: 20px;
  background: #ffffff;
}

.problem-number {
  position: absolute;
  top: 10px;
  left: 12px;
  z-index: 5;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 4px solid #17212b;
  border-radius: 50%;
  background: #ffffff;
  font-size: 28px;
  font-weight: 900;
}

.tape-area {
  position: relative;
  z-index: 2;
  width: min(1050px, 94%);
  margin: 58px auto 0;
}

.tape-row {
  display: grid;
  grid-template-columns: 105px minmax(250px, 1fr) 210px;
  align-items: center;
  gap: 14px;
  min-height: 92px;
}

.tape-label {
  font-size: 22px;
  font-weight: 900;
  text-align: center;
}

.tape-track {
  position: relative;
  height: 70px;
  display: flex;
  align-items: center;
}

.start-line {
  position: absolute;
  left: 0;
  top: 4px;
  width: 4px;
  height: 62px;
  background: #273b49;
}

.tape {
  height: 48px;
  border: 3px solid;
  box-shadow: 0 4px 8px rgba(0,0,0,.15);
}

.tape1 {
  border-color: #d83d73;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.85) 0 4px,
      transparent 5px
    ),
    #ff9fc0;
  background-size: 28px 28px;
}

.tape2 {
  border-color: #168ac8;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.45) 0 8px,
      transparent 8px 18px
    ),
    #83d8fa;
}

.answer-box {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  font-size: 20px;
  font-weight: 900;
}

input {
  width: 76px;
  height: 52px;
  border: 4px solid #283a48;
  border-radius: 12px;
  background: #ffffff;
  font-size: 29px;
  font-weight: 900;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #1684d1;
  box-shadow: 0 0 0 5px rgba(22,132,209,.15);
}

.calculation {
  position: relative;
  z-index: 2;
  width: fit-content;
  margin: 8px auto 0;
  padding: 9px 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 3px solid #f6c445;
  border-radius: 16px;
  background: #fff9da;
  font-size: 25px;
  font-weight: 900;
}

.ruler-home {
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 18px;
  height: 125px;
  border: 3px dashed #a7c8dd;
  border-radius: 16px;
  background: #f2faff;
}

.ruler-home-text {
  margin: 8px 0 0;
  color: #5e7788;
  font-size: 18px;
  font-weight: 900;
  text-align: center;
}

/* 定規 */

.ruler {
  position: absolute;
  z-index: 50;
  height: 92px;
  overflow: hidden;
  border: 3px solid #296d9f;
  border-radius: 6px;
  background:
    linear-gradient(
      to bottom,
      rgba(225,246,255,.78),
      rgba(174,219,244,.65)
    );
  box-shadow:
    0 8px 17px rgba(0,0,0,.25),
    inset 0 0 0 2px rgba(255,255,255,.7);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.ruler.dragging {
  cursor: grabbing;
  box-shadow:
    0 12px 24px rgba(0,0,0,.32),
    inset 0 0 0 2px rgba(255,255,255,.7);
}

.zero-line {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  width: 4px;
  height: 100%;
  background: #e32f4f;
  pointer-events: none;
}

.tick {
  position: absolute;
  top: 0;
  width: 1.5px;
  background: #111820;
  transform: translateX(-50%);
  pointer-events: none;
}

.tick.mm {
  height: 18px;
}

.tick.half {
  width: 2px;
  height: 28px;
}

.tick.cm {
  width: 2.5px;
  height: 41px;
}

.ruler-number {
  position: absolute;
  top: 45px;
  color: #101820;
  font-size: 18px;
  font-weight: 900;
  transform: translateX(-50%);
  pointer-events: none;
}

.ruler-number.first {
  transform: translateX(4px);
}

.ruler-number.last {
  transform: translateX(calc(-100% - 4px));
}

.ruler-unit {
  position: absolute;
  left: 12px;
  bottom: 7px;
  color: #145f93;
  font-size: 15px;
  font-weight: 900;
  pointer-events: none;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 9px;
}

.action-button {
  min-width: 190px;
  min-height: 55px;
  padding: 8px 20px;
  border-radius: 15px;
  font-size: 23px;
  font-weight: 900;
}

.check-button {
  color: #ffffff;
  background: #1686d3;
  box-shadow: 0 5px 0 #0b5d97;
}

.next-button {
  color: #352700;
  background: #ffd34f;
  box-shadow: 0 5px 0 #c99b00;
}

.action-button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(0,0,0,.25);
}

.result {
  min-height: 36px;
  margin-top: 5px;
  font-size: 24px;
  font-weight: 900;
  text-align: center;
}

.correct {
  color: #d92d68;
}

.wrong {
  color: #176fae;
}

.correct-input {
  border-color: #38a747 !important;
  background: #def8dc !important;
}

.wrong-input {
  border-color: #e23b61 !important;
  background: #ffe0e7 !important;
}

@media (max-width: 900px) {
  .app {
    padding: 8px 9px;
  }

  h1 {
    font-size: 27px;
  }

  .reset-button {
    padding: 7px 11px;
    font-size: 16px;
  }

  .tape-area {
    width: 96%;
  }

  .tape-row {
    grid-template-columns: 82px minmax(180px, 1fr) 175px;
    gap: 8px;
    min-height: 84px;
  }

  .tape-label {
    font-size: 18px;
  }

  .answer-box {
    font-size: 17px;
  }

  input {
    width: 66px;
    height: 48px;
    font-size: 26px;
  }

  .calculation {
    gap: 5px;
    padding: 7px 10px;
    font-size: 21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <h1>
      テープの長さをはかろう
    </h1>

    <button
      type="button"
      class="reset-button"
      id="resetRulerButton"
    >
      定規をもどす
    </button>

  </div>

  <p class="instruction">
    定規の0をテープの左端に合わせて、長さをはかりましょう。
  </p>

  <main
    class="main"
    id="main"
  >

    <div
      class="problem-number"
      id="problemNumber"
    >
      ①
    </div>

    <section class="tape-area">

      <div class="tape-row">

        <div class="tape-label">
          テープ①
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape1"
            id="tape1"
          ></div>

        </div>

        <label class="answer-box">

          長さ

          <input
            type="number"
            inputmode="numeric"
            id="answer1"
          >

          cm

        </label>

      </div>

      <div class="tape-row">

        <div class="tape-label">
          テープ②
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape2"
            id="tape2"
          ></div>

        </div>

        <label class="answer-box">

          長さ

          <input
            type="number"
            inputmode="numeric"
            id="answer2"
          >

          cm

        </label>

      </div>

    </section>

    <div class="calculation">

      <input
        type="number"
        inputmode="numeric"
        id="calc1"
      >

      <span>cm</span>

      <span>＋</span>

      <input
        type="number"
        inputmode="numeric"
        id="calc2"
      >

      <span>cm</span>

      <span>＝</span>

      <input
        type="number"
        inputmode="numeric"
        id="total"
      >

      <span>cm</span>

    </div>

    <div class="ruler-home">

      <p class="ruler-home-text">
        定規を動かして、テープの上に重ねてください。
      </p>

    </div>

    <div
      class="ruler"
      id="ruler"
    >

      <div class="zero-line"></div>

      <div id="rulerScale"></div>

      <div class="ruler-unit">
        cm
      </div>

    </div>

  </main>

  <div class="buttons">

    <button
      type="button"
      class="action-button check-button"
      id="checkButton"
    >
      こたえあわせ
    </button>

    <button
      type="button"
      class="action-button next-button"
      id="nextButton"
    >
      つぎのもんだい
    </button>

  </div>

  <div
    class="result"
    id="result"
  ></div>

</div>

<script>
"use strict";

const PIXELS_PER_CM = 46;
const RULER_LENGTH_CM = 10;

const problems = [
  { a: 4, b: 3 },
  { a: 5, b: 2 },
  { a: 6, b: 3 },
  { a: 7, b: 2 },
  { a: 5, b: 4 },
  { a: 6, b: 4 },
  { a: 7, b: 3 },
  { a: 8, b: 2 }
];

const problemMarks = [
  "①", "②", "③", "④",
  "⑤", "⑥", "⑦", "⑧"
];

let currentProblem = 0;

const main =
  document.getElementById("main");

const ruler =
  document.getElementById("ruler");

const rulerScale =
  document.getElementById("rulerScale");

const problemNumber =
  document.getElementById("problemNumber");

const tape1 =
  document.getElementById("tape1");

const tape2 =
  document.getElementById("tape2");

const answer1 =
  document.getElementById("answer1");

const answer2 =
  document.getElementById("answer2");

const calc1 =
  document.getElementById("calc1");

const calc2 =
  document.getElementById("calc2");

const total =
  document.getElementById("total");

const result =
  document.getElementById("result");

const resetRulerButton =
  document.getElementById("resetRulerButton");

const checkButton =
  document.getElementById("checkButton");

const nextButton =
  document.getElementById("nextButton");

function makeRuler() {

  ruler.style.width =
    RULER_LENGTH_CM * PIXELS_PER_CM + "px";

  rulerScale.innerHTML = "";

  for (
    let millimeter = 0;
    millimeter <= RULER_LENGTH_CM * 10;
    millimeter++
  ) {

    const x =
      millimeter * PIXELS_PER_CM / 10;

    const tick =
      document.createElement("div");

    tick.style.left =
      x + "px";

    if (millimeter % 10 === 0) {

      tick.className =
        "tick cm";

      const number =
        document.createElement("div");

      number.className =
        "ruler-number";

      number.style.left =
        x + "px";

      number.textContent =
        String(millimeter / 10);

      if (millimeter === 0) {
        number.classList.add("first");
      }

      if (
        millimeter ===
        RULER_LENGTH_CM * 10
      ) {
        number.classList.add("last");
      }

      rulerScale.appendChild(number);

    } else if (millimeter % 5 === 0) {

      tick.className =
        "tick half";

    } else {

      tick.className =
        "tick mm";

    }

    rulerScale.appendChild(tick);

  }

}

function resetRuler() {

  const left =
    Math.max(
      10,
      (main.clientWidth - ruler.offsetWidth) / 2
    );

  const top =
    Math.max(
      10,
      main.clientHeight -
      ruler.offsetHeight -
      32
    );

  ruler.style.left =
    left + "px";

  ruler.style.top =
    top + "px";

}

function clearInputs() {

  [
    answer1,
    answer2,
    calc1,
    calc2,
    total
  ].forEach(function(input) {

    input.value = "";

    input.classList.remove(
      "correct-input",
      "wrong-input"
    );

  });

  result.textContent = "";
  result.className = "result";

}

function showProblem() {

  const problem =
    problems[currentProblem];

  problemNumber.textContent =
    problemMarks[currentProblem];

  tape1.style.width =
    problem.a * PIXELS_PER_CM + "px";

  tape2.style.width =
    problem.b * PIXELS_PER_CM + "px";

  clearInputs();
  resetRuler();

}

function markInput(
  input,
  correct
) {

  input.classList.remove(
    "correct-input",
    "wrong-input"
  );

  input.classList.add(
    correct
      ? "correct-input"
      : "wrong-input"
  );

}

function checkAnswers() {

  const problem =
    problems[currentProblem];

  const inputs = [
    answer1,
    answer2,
    calc1,
    calc2,
    total
  ];

  const allEntered =
    inputs.every(function(input) {
      return input.value.trim() !== "";
    });

  if (!allEntered) {

    result.textContent =
      "まだ書いていないところがあります。";

    result.className =
      "result wrong";

    return;

  }

  const checks = [
    Number(answer1.value) === problem.a,
    Number(answer2.value) === problem.b,
    Number(calc1.value) === problem.a,
    Number(calc2.value) === problem.b,
    Number(total.value) === problem.a + problem.b
  ];

  inputs.forEach(function(input, index) {

    markInput(
      input,
      checks[index]
    );

  });

  if (checks.every(Boolean)) {

    result.textContent =
      "せいかい！ じょうずにはかれました！";

    result.className =
      "result correct";

  } else {

    result.textContent =
      "赤いところを、もういちど見なおしましょう。";

    result.className =
      "result wrong";

  }

}

function nextProblem() {

  currentProblem++;

  if (
    currentProblem >= problems.length
  ) {
    currentProblem = 0;
  }

  showProblem();

}

answer1.addEventListener(
  "input",
  function() {

    calc1.value =
      answer1.value;

    answer1.classList.remove(
      "correct-input",
      "wrong-input"
    );

    calc1.classList.remove(
      "correct-input",
      "wrong-input"
    );

    result.textContent = "";

  }
);

answer2.addEventListener(
  "input",
  function() {

    calc2.value =
      answer2.value;

    answer2.classList.remove(
      "correct-input",
      "wrong-input"
    );

    calc2.classList.remove(
      "correct-input",
      "wrong-input"
    );

    result.textContent = "";

  }
);

[
  calc1,
  calc2,
  total
].forEach(function(input) {

  input.addEventListener(
    "input",
    function() {

      input.classList.remove(
        "correct-input",
        "wrong-input"
      );

      result.textContent = "";

    }
  );

});

/* 定規のドラッグ */

let dragging = false;
let offsetX = 0;
let offsetY = 0;

ruler.addEventListener(
  "pointerdown",
  function(event) {

    dragging = true;

    ruler.classList.add("dragging");

    const rect =
      ruler.getBoundingClientRect();

    offsetX =
      event.clientX - rect.left;

    offsetY =
      event.clientY - rect.top;

    try {
      ruler.setPointerCapture(
        event.pointerId
      );
    } catch (error) {
    }

    event.preventDefault();

  }
);

ruler.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) {
      return;
    }

    const mainRect =
      main.getBoundingClientRect();

    let left =
      event.clientX -
      mainRect.left -
      offsetX;

    let top =
      event.clientY -
      mainRect.top -
      offsetY;

    const maxLeft =
      Math.max(
        0,
        main.clientWidth -
        ruler.offsetWidth
      );

    const maxTop =
      Math.max(
        0,
        main.clientHeight -
        ruler.offsetHeight
      );

    left =
      Math.max(
        0,
        Math.min(maxLeft, left)
      );

    top =
      Math.max(
        0,
        Math.min(maxTop, top)
      );

    ruler.style.left =
      left + "px";

    ruler.style.top =
      top + "px";

    event.preventDefault();

  }
);

function stopDragging(event) {

  dragging = false;

  ruler.classList.remove("dragging");

  try {
    ruler.releasePointerCapture(
      event.pointerId
    );
  } catch (error) {
  }

}

ruler.addEventListener(
  "pointerup",
  stopDragging
);

ruler.addEventListener(
  "pointercancel",
  stopDragging
);

resetRulerButton.addEventListener(
  "click",
  resetRuler
);

checkButton.addEventListener(
  "click",
  checkAnswers
);

nextButton.addEventListener(
  "click",
  nextProblem
);

window.addEventListener(
  "resize",
  function() {
    requestAnimationFrame(resetRuler);
  }
);

document.addEventListener(
  "dblclick",
  function(event) {
    event.preventDefault();
  },
  { passive: false }
);

document.addEventListener(
  "gesturestart",
  function(event) {
    event.preventDefault();
  },
  { passive: false }
);

makeRuler();

requestAnimationFrame(
  showProblem
);
</script>

</body>
</html>
