<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<title>テープの長さをはかろう</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background:#eaf6ff;
  color:#17212b;
  font-family:
    "UD デジタル 教科書体 N-R",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  touch-action:manipulation;
}

button{
  font:inherit;
  border:none;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:7px 10px 8px;
}

.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}

h1{
  margin:0;
  color:#176aab;
  font-size:clamp(24px,3vw,38px);
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.progress{
  min-width:105px;
  padding:7px 11px;
  border:3px solid #60a9d8;
  border-radius:14px;
  background:#fff;
  color:#175f96;
  font-size:19px;
  font-weight:900;
  text-align:center;
}

.reset-button{
  min-height:44px;
  padding:7px 13px;
  border-radius:14px;
  background:#fff;
  color:#176aab;
  font-size:16px;
  font-weight:900;
  box-shadow:0 4px 0 #b5d5e8;
}

.reset-button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #b5d5e8;
}

.instruction{
  flex:0 0 auto;
  margin:0 0 5px;
  padding:6px 12px;
  border-radius:13px;
  background:#fff;
  font-size:clamp(16px,1.8vw,22px);
  font-weight:900;
  text-align:center;
}

.main{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  border:4px solid #78bce8;
  border-radius:19px;
  background:#fff;
}

.problem-number{
  position:absolute;
  top:8px;
  left:10px;
  z-index:5;
  min-width:70px;
  height:45px;
  padding:0 10px;
  display:grid;
  place-items:center;
  border:4px solid #17212b;
  border-radius:23px;
  background:#fff;
  font-size:21px;
  font-weight:900;
}

.tape-area{
  position:relative;
  z-index:2;
  width:min(1120px,97%);
  margin:50px auto 0;
}

.tape-row{
  display:grid;
  grid-template-columns:95px minmax(220px,1fr) 260px;
  align-items:center;
  gap:11px;
  min-height:78px;
}

.tape-label{
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.tape-track{
  position:relative;
  height:62px;
  display:flex;
  align-items:center;
}

.start-line{
  position:absolute;
  left:0;
  top:3px;
  width:4px;
  height:56px;
  background:#273b49;
}

.tape{
  position:relative;
  height:44px;
  border:3px solid;
  box-shadow:0 4px 8px rgba(0,0,0,.15);
}

.tape::before,
.tape::after{
  content:"";
  position:absolute;
  top:-3px;
  width:8px;
  height:calc(100% + 6px);
  background:
    linear-gradient(
      135deg,
      transparent 0 20%,
      currentColor 21% 31%,
      transparent 32% 47%,
      currentColor 48% 58%,
      transparent 59% 74%,
      currentColor 75% 85%,
      transparent 86%
    );
}

.tape::before{
  left:-6px;
}

.tape::after{
  right:-6px;
  transform:scaleX(-1);
}

.tape1{
  color:#d83d73;
  border-color:#d83d73;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.85) 0 4px,
      transparent 5px
    ),
    #ff9fc0;
  background-size:28px 28px;
}

.tape2{
  color:#168ac8;
  border-color:#168ac8;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.45) 0 8px,
      transparent 8px 18px
    ),
    #83d8fa;
}

.answer-box{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  font-size:25px;
  font-weight:900;
  white-space:nowrap;
}

.answer-slot{
  width:105px;
  height:66px;
  display:grid;
  place-items:center;
  border:4px solid #283a48;
  border-radius:14px;
  background:#fff;
  font-size:39px;
  font-weight:900;
  line-height:1;
  user-select:none;
  -webkit-user-select:none;
  transition:
    border-color .15s,
    background .15s,
    transform .15s;
}

.answer-slot.empty::after{
  content:"";
  width:48%;
  height:4px;
  border-radius:4px;
  background:#c4cdd4;
}

.answer-slot.drag-over{
  border-color:#ff9f1a;
  background:#fff3ca;
  transform:scale(1.08);
}

.answer-slot.correct-input{
  border-color:#38a747;
  background:#def8dc;
}

.answer-slot.wrong-input{
  border-color:#2674c5;
  background:#ddebff;
}

.calculation{
  position:relative;
  z-index:2;
  width:fit-content;
  margin:2px auto 0;
  padding:7px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  border:3px solid #f6c445;
  border-radius:16px;
  background:#fff9da;
  font-size:22px;
  font-weight:900;
}

.calculation .answer-slot{
  width:88px;
  height:58px;
  font-size:35px;
}

.ruler-home{
  position:absolute;
  left:18px;
  right:18px;
  bottom:12px;
  height:132px;
  border:3px dashed #a7c8dd;
  border-radius:16px;
  background:#f2faff;
}

.ruler-home-text{
  margin:6px 0 0;
  color:#5e7788;
  font-size:16px;
  font-weight:900;
  text-align:center;
}

.ruler{
  position:absolute;
  z-index:50;
  height:108px;
  overflow:hidden;
  border:4px solid #296d9f;
  border-radius:7px;
  background:
    linear-gradient(
      to bottom,
      rgba(232,249,255,.86),
      rgba(168,218,245,.70)
    );
  box-shadow:
    0 9px 18px rgba(0,0,0,.27),
    inset 0 0 0 2px rgba(255,255,255,.75);
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.ruler.dragging{
  cursor:grabbing;
  box-shadow:
    0 13px 25px rgba(0,0,0,.34),
    inset 0 0 0 2px rgba(255,255,255,.75);
}

.tick{
  position:absolute;
  top:0;
  width:2px;
  background:#111820;
  transform:translateX(-50%);
  pointer-events:none;
}

.tick.mm{
  height:23px;
}

.tick.half{
  width:2.5px;
  height:35px;
}

.tick.cm{
  width:3px;
  height:50px;
}

.ruler-number{
  position:absolute;
  top:53px;
  color:#101820;
  font-size:22px;
  font-weight:900;
  transform:translateX(-50%);
  pointer-events:none;
}

.ruler-unit{
  position:absolute;
  left:42px;
  bottom:7px;
  color:#145f93;
  font-size:16px;
  font-weight:900;
  pointer-events:none;
}

.bottom-area{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

.keypad-wrap{
  min-width:0;
  padding:6px 8px 7px;
  border:3px solid #73b7de;
  border-radius:16px;
  background:#fff;
}

.keypad-title{
  margin:0 0 4px;
  color:#245d7d;
  font-size:16px;
  font-weight:900;
  text-align:center;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(11,minmax(48px,1fr));
  gap:6px;
}

.number-card{
  min-width:0;
  height:58px;
  display:grid;
  place-items:center;
  border:3px solid #225f91;
  border-radius:13px;
  background:linear-gradient(#fff,#dff1ff);
  color:#17212b;
  font-size:31px;
  font-weight:900;
  box-shadow:0 4px 0 #9abdd5;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.number-card.erase-card{
  border-color:#b65d28;
  background:linear-gradient(#fff8e5,#ffd6a3);
  color:#8b3f15;
  font-size:18px;
}

.number-card.dragging-source{
  opacity:.35;
}

.drag-ghost{
  position:fixed;
  z-index:5000;
  width:82px;
  height:82px;
  display:grid;
  place-items:center;
  border:5px solid #225f91;
  border-radius:18px;
  background:#fff;
  color:#17212b;
  font-size:43px;
  font-weight:900;
  box-shadow:0 12px 25px rgba(0,0,0,.35);
  pointer-events:none;
  transform:translate(-50%,-50%);
}

.drag-ghost.erase-ghost{
  width:105px;
  border-color:#b65d28;
  background:#fff2d8;
  color:#8b3f15;
  font-size:23px;
}

.action-area{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.action-button{
  min-width:195px;
  min-height:55px;
  padding:7px 18px;
  border-radius:15px;
  font-size:21px;
  font-weight:900;
}

.check-button{
  color:#fff;
  background:#1686d3;
  box-shadow:0 5px 0 #0b5d97;
}

.next-button{
  color:#352700;
  background:#ffd34f;
  box-shadow:0 5px 0 #c99b00;
}

.next-button:disabled,
.check-button:disabled{
  color:#777;
  background:#ddd;
  box-shadow:0 5px 0 #aaa;
}

.action-button:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.25);
}

.result{
  flex:0 0 auto;
  min-height:29px;
  margin-top:2px;
  font-size:21px;
  font-weight:900;
  text-align:center;
}

.correct-message{
  color:#df285d;
}

.wrong-message{
  color:#176fae;
}

.judge-mark{
  position:fixed;
  inset:0;
  z-index:6000;
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.judge-mark.show{
  display:flex;
  animation:judgePop .7s ease forwards;
}

.circle-mark{
  width:min(42vw,330px);
  aspect-ratio:1;
  border:clamp(24px,4vw,42px) solid #e62246;
  border-radius:50%;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
}

.cross-mark{
  position:relative;
  width:min(42vw,330px);
  aspect-ratio:1;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
}

.cross-mark::before,
.cross-mark::after{
  content:"";
  position:absolute;
  left:45%;
  top:0;
  width:11%;
  height:100%;
  border-radius:18px;
  background:#1976d2;
}

.cross-mark::before{
  transform:rotate(45deg);
}

.cross-mark::after{
  transform:rotate(-45deg);
}

@keyframes judgePop{
  0%{
    opacity:0;
    transform:scale(.4);
  }

  30%{
    opacity:1;
    transform:scale(1.12);
  }

  75%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}

.congratulations{
  position:fixed;
  inset:0;
  z-index:7000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.96),
      rgba(255,241,160,.97)
    );
}

.congratulations.show{
  display:flex;
}

.congratulations-card{
  position:relative;
  width:min(820px,94vw);
  max-height:92vh;
  overflow:hidden;
  padding:24px 28px 28px;
  border:8px solid #ffbd24;
  border-radius:34px;
  background:#fff;
  box-shadow:0 16px 35px rgba(0,0,0,.28);
  text-align:center;
}

.congratulations-card::before,
.congratulations-card::after{
  content:"★　★　★";
  position:absolute;
  color:#ffcf33;
  font-size:34px;
  letter-spacing:12px;
}

.congratulations-card::before{
  top:15px;
  left:25px;
  transform:rotate(-12deg);
}

.congratulations-card::after{
  right:25px;
  bottom:20px;
  transform:rotate(12deg);
}

.congratulations-title{
  position:relative;
  z-index:2;
  margin:0;
  color:#e83268;
  font-size:clamp(45px,8vw,82px);
  line-height:1.15;
  text-shadow:
    3px 3px 0 #fff,
    6px 6px 0 #ffd154;
}

.congratulations-picture{
  position:relative;
  z-index:2;
  width:min(430px,70vw);
  margin:8px auto 5px;
}

.congratulations-message{
  position:relative;
  z-index:2;
  margin:0 0 17px;
  color:#176aab;
  font-size:clamp(24px,4vw,38px);
  font-weight:900;
}

.restart-button{
  position:relative;
  z-index:3;
  min-width:220px;
  min-height:58px;
  padding:10px 24px;
  border-radius:18px;
  background:#ffcf42;
  color:#3a2a00;
  font-size:24px;
  font-weight:900;
  box-shadow:0 6px 0 #c49200;
}

.restart-button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #c49200;
}

@media(max-width:1050px){
  .tape-row{
    grid-template-columns:80px minmax(180px,1fr) 220px;
    gap:7px;
  }

  .tape-label{
    font-size:17px;
  }

  .answer-box{
    gap:6px;
    font-size:20px;
  }

  .answer-slot{
    width:88px;
    height:59px;
    font-size:34px;
  }

  .calculation .answer-slot{
    width:75px;
    height:53px;
    font-size:31px;
  }

  .keypad{
    gap:4px;
  }

  .number-card{
    height:52px;
    font-size:27px;
  }

  .action-button{
    min-width:175px;
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <h1>テープの長さをはかろう</h1>

    <div class="header-right">

      <div
        class="progress"
        id="progress"
      >
        1 / 10
      </div>

      <button
        type="button"
        class="reset-button"
        id="resetRulerButton"
      >
        定規をもどす
      </button>

    </div>

  </header>

  <p class="instruction">
    定規ではかり、数字を答えの枠へドラッグしましょう。
  </p>

  <main
    class="main"
    id="main"
  >

    <div
      class="problem-number"
      id="problemNumber"
    >
      1もんめ
    </div>

    <section class="tape-area">

      <div class="tape-row">

        <div class="tape-label">
          テープ①
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape1"
            id="tape1"
          ></div>

        </div>

        <div class="answer-box">

          <span>長さ</span>

          <div
            class="answer-slot empty"
            id="answer1"
            data-value=""
          ></div>

          <span>cm</span>

        </div>

      </div>

      <div class="tape-row">

        <div class="tape-label">
          テープ②
        </div>

        <div class="tape-track">

          <div class="start-line"></div>

          <div
            class="tape tape2"
            id="tape2"
          ></div>

        </div>

        <div class="answer-box">

          <span>長さ</span>

          <div
            class="answer-slot empty"
            id="answer2"
            data-value=""
          ></div>

          <span>cm</span>

        </div>

      </div>

    </section>

    <div class="calculation">

      <div
        class="answer-slot empty"
        id="calc1"
        data-value=""
      ></div>

      <span>cm</span>

      <span>＋</span>

      <div
        class="answer-slot empty"
        id="calc2"
        data-value=""
      ></div>

      <span>cm</span>

      <span>＝</span>

      <div
        class="answer-slot empty"
        id="total"
        data-value=""
      ></div>

      <span>cm</span>

    </div>

    <div class="ruler-home">

      <p class="ruler-home-text">
        定規を動かして、テープの上に重ねてください。
      </p>

    </div>

    <div
      class="ruler"
      id="ruler"
    >

      <div id="rulerScale"></div>

      <div class="ruler-unit">
        cm
      </div>

    </div>

  </main>

  <div class="bottom-area">

    <div class="keypad-wrap">

      <p class="keypad-title">
        数字を答えの枠へドラッグ
      </p>

      <div
        class="keypad"
        id="keypad"
      >

        <div
          class="number-card"
          data-key="0"
        >
          0
        </div>

        <div
          class="number-card"
          data-key="1"
        >
          1
        </div>

        <div
          class="number-card"
          data-key="2"
        >
          2
        </div>

        <div
          class="number-card"
          data-key="3"
        >
          3
        </div>

        <div
          class="number-card"
          data-key="4"
        >
          4
        </div>

        <div
          class="number-card"
          data-key="5"
        >
          5
        </div>

        <div
          class="number-card"
          data-key="6"
        >
          6
        </div>

        <div
          class="number-card"
          data-key="7"
        >
          7
        </div>

        <div
          class="number-card"
          data-key="8"
        >
          8
        </div>

        <div
          class="number-card"
          data-key="9"
        >
          9
        </div>

        <div
          class="number-card erase-card"
          data-key="erase"
        >
          けす
        </div>

      </div>

    </div>

    <div class="action-area">

      <button
        type="button"
        class="action-button check-button"
        id="checkButton"
      >
        こたえあわせ
      </button>

      <button
        type="button"
        class="action-button next-button"
        id="nextButton"
        disabled
      >
        つぎのもんだい
      </button>

    </div>

  </div>

  <div
    class="result"
    id="result"
    aria-live="polite"
  ></div>

</div>

<div
  class="judge-mark"
  id="correctMark"
>
  <div class="circle-mark"></div>
</div>

<div
  class="judge-mark"
  id="wrongMark"
>
  <div class="cross-mark"></div>
</div>

<div
  class="congratulations"
  id="congratulations"
>

  <div class="congratulations-card">

    <h2 class="congratulations-title">
      おめでとう！
    </h2>

    <svg
      class="congratulations-picture"
      viewBox="0 0 600 330"
      role="img"
      aria-label="お祝いの画像"
    >

      <defs>

        <linearGradient
          id="rainbow"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >

          <stop
            offset="0%"
            stop-color="#ff4b6e"
          />

          <stop
            offset="25%"
            stop-color="#ffbd35"
          />

          <stop
            offset="50%"
            stop-color="#55c96b"
          />

          <stop
            offset="75%"
            stop-color="#4b9fea"
          />

          <stop
            offset="100%"
            stop-color="#9c61e8"
          />

        </linearGradient>

      </defs>

      <path
        d="M105 250 A195 195 0 0 1 495 250"
        fill="none"
        stroke="url(#rainbow)"
        stroke-width="45"
        stroke-linecap="round"
      />

      <ellipse
        cx="300"
        cy="275"
        rx="180"
        ry="28"
        fill="#d8f2ff"
      />

      <path
        d="M250 235 L270 165 L300 215 L330 165 L350 235 Z"
        fill="#ffd83d"
        stroke="#e39800"
        stroke-width="7"
      />

      <circle
        cx="300"
        cy="170"
        r="14"
        fill="#ff4b6e"
      />

      <circle
        cx="270"
        cy="150"
        r="14"
        fill="#4b9fea"
      />

      <circle
        cx="330"
        cy="150"
        r="14"
        fill="#55c96b"
      />

      <circle
        cx="300"
        cy="255"
        r="72"
        fill="#ffcf56"
        stroke="#e49b00"
        stroke-width="7"
      />

      <circle
        cx="276"
        cy="244"
        r="7"
        fill="#323232"
      />

      <circle
        cx="324"
        cy="244"
        r="7"
        fill="#323232"
      />

      <path
        d="M274 274 Q300 298 326 274"
        fill="none"
        stroke="#d94f5c"
        stroke-width="8"
        stroke-linecap="round"
      />

      <path
        d="M180 215 L193 242 L223 246 L201 267 L207 297 L180 283 L153 297 L159 267 L137 246 L167 242 Z"
        fill="#ff5b86"
      />

      <path
        d="M420 215 L433 242 L463 246 L441 267 L447 297 L420 283 L393 297 L399 267 L377 246 L407 242 Z"
        fill="#55b7ff"
      />

    </svg>

    <p class="congratulations-message">
      10もん ぜんぶ せいかい！
    </p>

    <button
      type="button"
      class="restart-button"
      id="restartButton"
    >
      もういちど
    </button>

  </div>

</div>

<script>
"use strict";

const PIXELS_PER_CM = 52;
const RULER_LENGTH_CM = 10;
const RULER_LEFT_MARGIN = 22;
const RULER_RIGHT_MARGIN = 22;

const problems = [
  {a:3,b:2},
  {a:4,b:3},
  {a:5,b:2},
  {a:6,b:3},
  {a:7,b:2},
  {a:5,b:4},
  {a:6,b:4},
  {a:7,b:3},
  {a:8,b:2},
  {a:8,b:1}
];

let currentProblem = 0;
let problemCleared = false;
let markTimer = null;

const main =
  document.getElementById("main");

const ruler =
  document.getElementById("ruler");

const rulerScale =
  document.getElementById("rulerScale");

const problemNumber =
  document.getElementById("problemNumber");

const progress =
  document.getElementById("progress");

const tape1 =
  document.getElementById("tape1");

const tape2 =
  document.getElementById("tape2");

const answer1 =
  document.getElementById("answer1");

const answer2 =
  document.getElementById("answer2");

const calc1 =
  document.getElementById("calc1");

const calc2 =
  document.getElementById("calc2");

const total =
  document.getElementById("total");

const answerSlots = [
  answer1,
  answer2,
  calc1,
  calc2,
  total
];

const result =
  document.getElementById("result");

const correctMark =
  document.getElementById("correctMark");

const wrongMark =
  document.getElementById("wrongMark");

const congratulations =
  document.getElementById("congratulations");

const resetRulerButton =
  document.getElementById("resetRulerButton");

const checkButton =
  document.getElementById("checkButton");

const nextButton =
  document.getElementById("nextButton");

const restartButton =
  document.getElementById("restartButton");

function makeRuler(){

  ruler.style.width =
    RULER_LEFT_MARGIN +
    RULER_LENGTH_CM * PIXELS_PER_CM +
    RULER_RIGHT_MARGIN +
    "px";

  rulerScale.innerHTML = "";

  for(
    let millimeter = 0;
    millimeter <= RULER_LENGTH_CM * 10;
    millimeter++
  ){

    const x =
      RULER_LEFT_MARGIN +
      millimeter * PIXELS_PER_CM / 10;

    const tick =
      document.createElement("div");

    tick.style.left =
      x + "px";

    if(millimeter % 10 === 0){

      tick.className =
        "tick cm";

      const number =
        document.createElement("div");

      number.className =
        "ruler-number";

      number.style.left =
        x + "px";

      number.textContent =
        String(millimeter / 10);

      rulerScale.appendChild(number);

    }else if(millimeter % 5 === 0){

      tick.className =
        "tick half";

    }else{

      tick.className =
        "tick mm";

    }

    rulerScale.appendChild(tick);

  }

}

function resetRuler(){

  const left =
    Math.max(
      8,
      (main.clientWidth - ruler.offsetWidth) / 2
    );

  const top =
    Math.max(
      8,
      main.clientHeight -
      ruler.offsetHeight -
      20
    );

  ruler.style.left =
    left + "px";

  ruler.style.top =
    top + "px";

}

function setSlotValue(
  slot,
  value
){

  const textValue =
    String(value);

  slot.dataset.value =
    textValue;

  slot.textContent =
    textValue;

  if(textValue === ""){

    slot.classList.add("empty");

  }else{

    slot.classList.remove("empty");

  }

}

function clearSlotStyle(
  slot
){

  slot.classList.remove(
    "correct-input",
    "wrong-input"
  );

}

function clearInputStyles(){

  answerSlots.forEach(function(slot){

    clearSlotStyle(slot);

  });

}

function clearInputs(){

  answerSlots.forEach(function(slot){

    setSlotValue(
      slot,
      ""
    );

  });

  clearInputStyles();

  result.textContent = "";
  result.className = "result";

  problemCleared = false;

  nextButton.disabled = true;
  checkButton.disabled = false;

}

function showProblem(){

  const problem =
    problems[currentProblem];

  problemNumber.textContent =
    currentProblem + 1 + "もんめ";

  progress.textContent =
    currentProblem + 1 +
    " / " +
    problems.length;

  tape1.style.width =
    problem.a * PIXELS_PER_CM +
    "px";

  tape2.style.width =
    problem.b * PIXELS_PER_CM +
    "px";

  clearInputs();

  requestAnimationFrame(
    resetRuler
  );

}

function showJudgeMark(
  markElement
){

  clearTimeout(markTimer);

  correctMark.classList.remove("show");
  wrongMark.classList.remove("show");

  void markElement.offsetWidth;

  markElement.classList.add("show");

  markTimer =
    setTimeout(function(){

      markElement.classList.remove("show");

    },720);

}

function markSlot(
  slot,
  correct
){

  slot.classList.remove(
    "correct-input",
    "wrong-input"
  );

  slot.classList.add(
    correct
      ? "correct-input"
      : "wrong-input"
  );

}

function checkAnswers(){

  if(problemCleared){
    return;
  }

  const problem =
    problems[currentProblem];

  const allEntered =
    answerSlots.every(function(slot){

      return slot.dataset.value !== "";

    });

  if(!allEntered){

    clearInputStyles();

    showJudgeMark(
      wrongMark
    );

    result.textContent =
      "まだ入っていないところがあります。";

    result.className =
      "result wrong-message";

    return;

  }

  const checks = [
    Number(answer1.dataset.value) === problem.a,
    Number(answer2.dataset.value) === problem.b,
    Number(calc1.dataset.value) === problem.a,
    Number(calc2.dataset.value) === problem.b,
    Number(total.dataset.value) === problem.a + problem.b
  ];

  answerSlots.forEach(function(
    slot,
    index
  ){

    markSlot(
      slot,
      checks[index]
    );

  });

  if(checks.every(Boolean)){

    problemCleared = true;

    showJudgeMark(
      correctMark
    );

    result.textContent =
      "せいかい！ じょうずにはかれました！";

    result.className =
      "result correct-message";

    checkButton.disabled = true;

    if(
      currentProblem ===
      problems.length - 1
    ){

      nextButton.disabled = true;

      setTimeout(function(){

        congratulations.classList.add(
          "show"
        );

      },760);

    }else{

      nextButton.disabled = false;

    }

  }else{

    showJudgeMark(
      wrongMark
    );

    result.textContent =
      "青いところを、もういちど見なおしましょう。";

    result.className =
      "result wrong-message";

    nextButton.disabled = true;

  }

}

function nextProblem(){

  if(!problemCleared){
    return;
  }

  if(
    currentProblem <
    problems.length - 1
  ){

    currentProblem++;

    showProblem();

  }

}

function restartGame(){

  currentProblem = 0;
  problemCleared = false;

  congratulations.classList.remove(
    "show"
  );

  showProblem();

}

function clearResultAfterInput(){

  if(problemCleared){
    return;
  }

  result.textContent = "";
  result.className = "result";

}

function getSlotAtPoint(
  clientX,
  clientY
){

  for(
    const slot of answerSlots
  ){

    const rect =
      slot.getBoundingClientRect();

    if(
      clientX >= rect.left &&
      clientX <= rect.right &&
      clientY >= rect.top &&
      clientY <= rect.bottom
    ){

      return slot;

    }

  }

  return null;

}

function removeDragOver(){

  answerSlots.forEach(function(slot){

    slot.classList.remove(
      "drag-over"
    );

  });

}

let keypadDragging = false;
let draggedKey = "";
let dragSource = null;
let dragGhost = null;
let keypadPointerId = null;

function createDragGhost(
  key
){

  const ghost =
    document.createElement("div");

  ghost.className =
    "drag-ghost";

  if(key === "erase"){

    ghost.classList.add(
      "erase-ghost"
    );

    ghost.textContent =
      "けす";

  }else{

    ghost.textContent =
      key;

  }

  document.body.appendChild(
    ghost
  );

  return ghost;

}

function moveDragGhost(
  clientX,
  clientY
){

  if(!dragGhost){
    return;
  }

  dragGhost.style.left =
    clientX + "px";

  dragGhost.style.top =
    clientY + "px";

  removeDragOver();

  const target =
    getSlotAtPoint(
      clientX,
      clientY
    );

  if(target){

    target.classList.add(
      "drag-over"
    );

  }

}

function finishKeypadDrag(
  clientX,
  clientY
){

  if(!keypadDragging){
    return;
  }

  const target =
    getSlotAtPoint(
      clientX,
      clientY
    );

  if(
    target &&
    !problemCleared
  ){

    clearSlotStyle(
      target
    );

    if(draggedKey === "erase"){

      setSlotValue(
        target,
        ""
      );

    }else{

      const currentValue =
        target.dataset.value || "";

      let nextValue;

      if(
        currentValue === "" ||
        currentValue.length >= 2
      ){

        nextValue =
          draggedKey;

      }else{

        nextValue =
          currentValue +
          draggedKey;

      }

      if(
        nextValue.length > 1 &&
        nextValue.startsWith("0")
      ){

        nextValue =
          String(
            Number(nextValue)
          );

      }

      setSlotValue(
        target,
        nextValue
      );

    }

    clearResultAfterInput();

  }

  removeDragOver();

  if(dragGhost){

    dragGhost.remove();
    dragGhost = null;

  }

  if(dragSource){

    dragSource.classList.remove(
      "dragging-source"
    );

  }

  keypadDragging = false;
  draggedKey = "";
  dragSource = null;
  keypadPointerId = null;

}

document
  .querySelectorAll(".number-card")
  .forEach(function(card){

    card.addEventListener(
      "pointerdown",
      function(event){

        if(problemCleared){
          return;
        }

        keypadDragging = true;

        draggedKey =
          card.dataset.key;

        dragSource =
          card;

        keypadPointerId =
          event.pointerId;

        card.classList.add(
          "dragging-source"
        );

        dragGhost =
          createDragGhost(
            draggedKey
          );

        moveDragGhost(
          event.clientX,
          event.clientY
        );

        try{

          card.setPointerCapture(
            event.pointerId
          );

        }catch(error){
        }

        event.preventDefault();

      }
    );

    card.addEventListener(
      "pointermove",
      function(event){

        if(
          !keypadDragging ||
          event.pointerId !==
          keypadPointerId
        ){
          return;
        }

        moveDragGhost(
          event.clientX,
          event.clientY
        );

        event.preventDefault();

      }
    );

    card.addEventListener(
      "pointerup",
      function(event){

        if(
          event.pointerId !==
          keypadPointerId
        ){
          return;
        }

        finishKeypadDrag(
          event.clientX,
          event.clientY
        );

        try{

          card.releasePointerCapture(
            event.pointerId
          );

        }catch(error){
        }

        event.preventDefault();

      }
    );

    card.addEventListener(
      "pointercancel",
      function(event){

        finishKeypadDrag(
          event.clientX,
          event.clientY
        );

      }
    );

  });

let rulerDragging = false;
let rulerOffsetX = 0;
let rulerOffsetY = 0;

ruler.addEventListener(
  "pointerdown",
  function(event){

    rulerDragging = true;

    ruler.classList.add(
      "dragging"
    );

    const rect =
      ruler.getBoundingClientRect();

    rulerOffsetX =
      event.clientX -
      rect.left;

    rulerOffsetY =
      event.clientY -
      rect.top;

    try{

      ruler.setPointerCapture(
        event.pointerId
      );

    }catch(error){
    }

    event.preventDefault();

  }
);

ruler.addEventListener(
  "pointermove",
  function(event){

    if(!rulerDragging){
      return;
    }

    const mainRect =
      main.getBoundingClientRect();

    let left =
      event.clientX -
      mainRect.left -
      rulerOffsetX;

    let top =
      event.clientY -
      mainRect.top -
      rulerOffsetY;

    const maxLeft =
      Math.max(
        0,
        main.clientWidth -
        ruler.offsetWidth
      );

    const maxTop =
      Math.max(
        0,
        main.clientHeight -
        ruler.offsetHeight
      );

    left =
      Math.max(
        0,
        Math.min(
          maxLeft,
          left
        )
      );

    top =
      Math.max(
        0,
        Math.min(
          maxTop,
          top
        )
      );

    ruler.style.left =
      left + "px";

    ruler.style.top =
      top + "px";

    event.preventDefault();

  }
);

function stopRulerDragging(
  event
){

  if(!rulerDragging){
    return;
  }

  rulerDragging = false;

  ruler.classList.remove(
    "dragging"
  );

  try{

    ruler.releasePointerCapture(
      event.pointerId
    );

  }catch(error){
  }

}

ruler.addEventListener(
  "pointerup",
  stopRulerDragging
);

ruler.addEventListener(
  "pointercancel",
  stopRulerDragging
);

resetRulerButton.addEventListener(
  "click",
  resetRuler
);

checkButton.addEventListener(
  "click",
  checkAnswers
);

nextButton.addEventListener(
  "click",
  nextProblem
);

restartButton.addEventListener(
  "click",
  restartGame
);

window.addEventListener(
  "resize",
  function(){

    requestAnimationFrame(
      resetRuler
    );

  }
);

document.addEventListener(
  "dblclick",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);

document.addEventListener(
  "gesturestart",
  function(event){

    event.preventDefault();

  },
  {
    passive:false
  }
);

makeRuler();

requestAnimationFrame(
  showProblem
);
</script>

</body>
</html>
