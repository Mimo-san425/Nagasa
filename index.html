<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
<title>テープの長さをはかろう</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overscroll-behavior: none;
}

body {
  background: #eaf5ff;
  color: #16202a;
  font-family:
    "UD デジタル 教科書体 N-R",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  touch-action: manipulation;
}

button,
input {
  font: inherit;
}

button {
  touch-action: manipulation;
}

.app {
  width: 100%;
  min-height: 100vh;
  padding: 18px 22px 24px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 14px;
}

.title {
  margin: 0;
  font-size: clamp(28px, 3.2vw, 42px);
  line-height: 1.25;
  color: #135f9c;
}

.header-buttons {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}

.small-button {
  min-height: 54px;
  padding: 8px 18px;
  border: 0;
  border-radius: 14px;
  background: #fff;
  color: #135f9c;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 4px 0 #b8d6eb;
}

.small-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #b8d6eb;
}

.instruction {
  margin: 0 0 14px;
  padding: 12px 18px;
  border-radius: 15px;
  background: #fff;
  font-size: clamp(20px, 2.2vw, 28px);
  font-weight: 800;
  text-align: center;
  box-shadow: 0 3px 10px rgba(36, 91, 130, 0.12);
}

.main-area {
  position: relative;
  width: 100%;
  min-height: 540px;
  padding: 18px;
  border: 4px solid #7bbce8;
  border-radius: 22px;
  background: #fff;
  overflow: hidden;
}

.problem-number {
  position: absolute;
  top: 15px;
  left: 18px;
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border: 4px solid #17202a;
  border-radius: 50%;
  background: #fff;
  font-size: 30px;
  font-weight: 900;
}

.tape-zone {
  width: min(1000px, 88%);
  margin: 54px auto 0;
}

.tape-row {
  display: grid;
  grid-template-columns: 120px minmax(180px, 1fr) 245px;
  align-items: center;
  gap: 22px;
  min-height: 106px;
  margin-bottom: 12px;
}

.tape-name {
  font-size: 27px;
  font-weight: 900;
  text-align: center;
}

.tape-track {
  position: relative;
  height: 74px;
  display: flex;
  align-items: center;
  padding-left: 4px;
  border-left: 4px dashed #8ba3b5;
}

.tape {
  position: relative;
  height: 58px;
  border: 3px solid;
  border-radius: 3px;
  box-shadow: 0 4px 8px rgba(0,0,0,.12);
}

.tape::before,
.tape::after {
  content: "";
  position: absolute;
  top: -3px;
  width: 10px;
  height: calc(100% + 6px);
  background:
    linear-gradient(
      135deg,
      transparent 0 22%,
      currentColor 23% 32%,
      transparent 33% 48%,
      currentColor 49% 58%,
      transparent 59% 74%,
      currentColor 75% 84%,
      transparent 85%
    );
}

.tape::before {
  left: -7px;
}

.tape::after {
  right: -7px;
  transform: scaleX(-1);
}

.tape-a {
  color: #e94d87;
  border-color: #e94d87;
  background-color: #ff9fc1;
  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.9) 0 4px,
      transparent 5px
    );
  background-size: 28px 28px;
}

.tape-b {
  color: #1995d3;
  border-color: #1995d3;
  background-color: #84d7fb;
  background-image:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.38) 0 8px,
      transparent 8px 18px
    );
}

.measure-input-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
  font-size: 24px;
  font-weight: 800;
}

.number-input {
  width: 105px;
  height: 64px;
  border: 4px solid #263746;
  border-radius: 13px;
  background: #fff;
  color: #111;
  font-size: 36px;
  font-weight: 900;
  text-align: center;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}

.number-input:focus {
  border-color: #147bc1;
  box-shadow: 0 0 0 5px rgba(20,123,193,.15);
}

.calculation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 14px auto 8px;
  padding: 14px 18px;
  border: 3px solid #ffc949;
  border-radius: 18px;
  background: #fff9d9;
  font-size: clamp(25px, 2.8vw, 36px);
  font-weight: 900;
}

.calc-input {
  width: 105px;
  height: 66px;
  border: 4px solid #263746;
  border-radius: 13px;
  background: #fff;
  font-size: 36px;
  font-weight: 900;
  text-align: center;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}

.calc-input:focus {
  border-color: #e09900;
  box-shadow: 0 0 0 5px rgba(255,180,0,.18);
}

.ruler-area {
  position: relative;
  height: 170px;
  margin-top: 12px;
  border-top: 3px dashed #b6c7d4;
}

.ruler-help {
  position: absolute;
  top: 8px;
  left: 0;
  width: 100%;
  margin: 0;
  color: #496476;
  font-size: 20px;
  font-weight: 800;
  text-align: center;
  pointer-events: none;
}

.ruler {
  position: absolute;
  left: 90px;
  top: 48px;
  height: 104px;
  border: 4px solid #176fb0;
  border-radius: 12px;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.75),
      rgba(162,218,255,.72)
    );
  box-shadow: 0 7px 13px rgba(0,0,0,.17);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  overflow: hidden;
  z-index: 20;
}

.ruler.dragging {
  cursor: grabbing;
  box-shadow: 0 10px 20px rgba(0,0,0,.28);
}

.ruler-scale {
  position: relative;
  height: 100%;
}

.tick {
  position: absolute;
  top: 0;
  width: 2px;
  background: #101820;
  transform: translateX(-1px);
  pointer-events: none;
}

.tick.small {
  height: 26px;
}

.tick.middle {
  height: 38px;
}

.tick.large {
  width: 3px;
  height: 53px;
  transform: translateX(-1.5px);
}

.ruler-number {
  position: absolute;
  top: 53px;
  transform: translateX(-50%);
  font-size: 22px;
  font-weight: 900;
  pointer-events: none;
}

.ruler-cm {
  position: absolute;
  left: 12px;
  bottom: 7px;
  color: #135f9c;
  font-size: 18px;
  font-weight: 900;
  pointer-events: none;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 16px;
}

.action-button {
  min-width: 200px;
  min-height: 64px;
  padding: 10px 24px;
  border: 0;
  border-radius: 17px;
  font-size: 27px;
  font-weight: 900;
}

.check-button {
  color: #fff;
  background: #1686d3;
  box-shadow: 0 6px 0 #0b5b94;
}

.next-button {
  color: #2d2100;
  background: #ffd24e;
  box-shadow: 0 6px 0 #c89a00;
}

.action-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,.28);
}

.result {
  min-height: 52px;
  margin-top: 12px;
  font-size: 30px;
  font-weight: 900;
  text-align: center;
}

.correct-message {
  color: #d92765;
}

.error-message {
  color: #176fb0;
}

.correct-input {
  background: #dff8dc !important;
  border-color: #3aa846 !important;
}

.wrong-input {
  background: #ffe0e6 !important;
  border-color: #e33b62 !important;
}

.calibration-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(20, 42, 58, .72);
}

.calibration-screen.show {
  display: flex;
}

.calibration-box {
  width: min(760px, 96vw);
  padding: 26px;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 15px 45px rgba(0,0,0,.32);
  text-align: center;
}

.calibration-box h2 {
  margin: 0 0 14px;
  color: #135f9c;
  font-size: 34px;
}

.calibration-box p {
  margin: 8px 0;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.6;
}

.calibration-line-wrap {
  max-width: 100%;
  margin: 25px auto 18px;
  overflow-x: auto;
  padding: 12px 0;
}

.calibration-line {
  position: relative;
  height: 28px;
  margin: 0 auto;
  border-top: 7px solid #e64545;
}

.calibration-line::before,
.calibration-line::after {
  content: "";
  position: absolute;
  top: -16px;
  width: 7px;
  height: 26px;
  background: #e64545;
}

.calibration-line::before {
  left: 0;
}

.calibration-line::after {
  right: 0;
}

.calibration-label {
  margin-top: 8px;
  color: #d52e2e;
  font-size: 27px;
  font-weight: 900;
}

.calibration-slider {
  width: min(600px, 90%);
  height: 40px;
}

.calibration-value {
  margin: 8px 0 15px;
  font-size: 20px;
  font-weight: 800;
}

.calibration-button {
  min-width: 210px;
  min-height: 62px;
  border: 0;
  border-radius: 16px;
  color: #fff;
  background: #1686d3;
  font-size: 27px;
  font-weight: 900;
  box-shadow: 0 6px 0 #0b5b94;
}

@media (orientation: portrait) {
  .header {
    align-items: flex-start;
  }

  .tape-row {
    grid-template-columns: 90px minmax(160px, 1fr);
  }

  .measure-input-area {
    grid-column: 1 / -1;
    justify-content: center;
  }

  .main-area {
    min-height: 760px;
  }

  .calculation {
    flex-wrap: wrap;
  }
}

@media (max-width: 850px) {
  .app {
    padding: 12px;
  }

  .header {
    gap: 8px;
  }

  .header-buttons {
    gap: 7px;
  }

  .small-button {
    min-height: 48px;
    padding: 7px 11px;
    font-size: 17px;
  }

  .main-area {
    padding: 12px;
  }

  .tape-zone {
    width: 95%;
  }

  .tape-row {
    grid-template-columns: 90px minmax(170px, 1fr) 210px;
    gap: 12px;
  }

  .tape-name {
    font-size: 23px;
  }

  .measure-input-area {
    font-size: 21px;
  }

  .number-input {
    width: 90px;
    height: 58px;
    font-size: 32px;
  }

  .calc-input {
    width: 90px;
    height: 60px;
    font-size: 32px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <h1 class="title">テープの 長さを はかろう</h1>

    <div class="header-buttons">
      <button
        type="button"
        class="small-button"
        id="calibrationOpenButton"
      >
        定規を合わせる
      </button>

      <button
        type="button"
        class="small-button"
        id="resetRulerButton"
      >
        定規をもどす
      </button>
    </div>
  </header>

  <p class="instruction">
    定規を動かして長さをはかり、数字を書いて、たし算しましょう。
  </p>

  <main class="main-area">

    <div class="problem-number" id="problemNumber">①</div>

    <section class="tape-zone">

      <div class="tape-row">
        <div class="tape-name">テープ①</div>

        <div class="tape-track">
          <div class="tape tape-a" id="tapeA"></div>
        </div>

        <label class="measure-input-area">
          長さ
          <input
            id="measureA"
            class="number-input"
            type="number"
            inputmode="numeric"
            min="0"
            max="20"
            aria-label="テープ1の長さ"
          >
          cm
        </label>
      </div>

      <div class="tape-row">
        <div class="tape-name">テープ②</div>

        <div class="tape-track">
          <div class="tape tape-b" id="tapeB"></div>
        </div>

        <label class="measure-input-area">
          長さ
          <input
            id="measureB"
            class="number-input"
            type="number"
            inputmode="numeric"
            min="0"
            max="20"
            aria-label="テープ2の長さ"
          >
          cm
        </label>
      </div>

      <div class="calculation">
        <input
          id="calcA"
          class="calc-input"
          type="number"
          inputmode="numeric"
          aria-label="計算する1つ目の長さ"
        >
        <span>cm</span>

        <span>＋</span>

        <input
          id="calcB"
          class="calc-input"
          type="number"
          inputmode="numeric"
          aria-label="計算する2つ目の長さ"
        >
        <span>cm</span>

        <span>＝</span>

        <input
          id="calcAnswer"
          class="calc-input"
          type="number"
          inputmode="numeric"
          aria-label="足し算の答え"
        >
        <span>cm</span>
      </div>

    </section>

    <section class="ruler-area" id="rulerArea">

      <p class="ruler-help">
        青い定規を、指で動かせます。
      </p>

      <div class="ruler" id="ruler">
        <div class="ruler-scale" id="rulerScale"></div>
        <div class="ruler-cm">cm</div>
      </div>

    </section>

  </main>

  <div class="actions">
    <button
      type="button"
      class="action-button check-button"
      id="checkButton"
    >
      こたえあわせ
    </button>

    <button
      type="button"
      class="action-button next-button"
      id="nextButton"
    >
      つぎのもんだい
    </button>
  </div>

  <div class="result" id="result" aria-live="polite"></div>

</div>

<div class="calibration-screen show" id="calibrationScreen">

  <div class="calibration-box">

    <h2>定規の大きさを合わせよう</h2>

    <p>
      本物の定規を画面に当てます。
    </p>

    <p>
      下の赤い線が、本物の定規の10cmと同じ長さになるように、
      つまみを動かしてください。
    </p>

    <div class="calibration-line-wrap">
      <div class="calibration-line" id="calibrationLine"></div>
      <div class="calibration-label">10cm</div>
    </div>

    <input
      id="calibrationSlider"
      class="calibration-slider"
      type="range"
      min="30"
      max="75"
      step="0.2"
      value="48"
    >

    <div class="calibration-value" id="calibrationValue"></div>

    <button
      type="button"
      class="calibration-button"
      id="calibrationDoneButton"
    >
      これで決定
    </button>

  </div>

</div>

<script>
"use strict";

const problems = [
  { a: 4, b: 3 },
  { a: 5, b: 2 },
  { a: 6, b: 3 },
  { a: 7, b: 2 },
  { a: 5, b: 4 },
  { a: 8, b: 3 },
  { a: 6, b: 5 },
  { a: 7, b: 4 }
];

let problemIndex = 0;
let pixelsPerCm = Number(
  localStorage.getItem("tapePixelsPerCm")
) || 48;

const problemNumber = document.getElementById("problemNumber");
const tapeA = document.getElementById("tapeA");
const tapeB = document.getElementById("tapeB");

const measureA = document.getElementById("measureA");
const measureB = document.getElementById("measureB");
const calcA = document.getElementById("calcA");
const calcB = document.getElementById("calcB");
const calcAnswer = document.getElementById("calcAnswer");

const result = document.getElementById("result");

const ruler = document.getElementById("ruler");
const rulerScale = document.getElementById("rulerScale");
const rulerArea = document.getElementById("rulerArea");

const calibrationScreen =
  document.getElementById("calibrationScreen");
const calibrationSlider =
  document.getElementById("calibrationSlider");
const calibrationLine =
  document.getElementById("calibrationLine");
const calibrationValue =
  document.getElementById("calibrationValue");

const numberMarks = [
  "①", "②", "③", "④",
  "⑤", "⑥", "⑦", "⑧"
];

function updateCalibrationLine() {
  const value = Number(calibrationSlider.value);

  calibrationLine.style.width = (value * 10) + "px";

  calibrationValue.textContent =
    "現在の設定：" + value.toFixed(1) + "px ＝ 1cm";
}

function createRuler() {
  const maximumCm = 15;
  const totalWidth = maximumCm * pixelsPerCm;

  ruler.style.width = totalWidth + "px";
  rulerScale.innerHTML = "";

  for (let mm = 0; mm <= maximumCm * 10; mm++) {
    const position = mm * pixelsPerCm / 10;

    const tick = document.createElement("div");
    tick.className = "tick";
    tick.style.left = position + "px";

    if (mm % 10 === 0) {
      tick.classList.add("large");

      const number = document.createElement("div");
      number.className = "ruler-number";
      number.style.left = position + "px";
      number.textContent = String(mm / 10);

      rulerScale.appendChild(number);

    } else if (mm % 5 === 0) {
      tick.classList.add("middle");

    } else {
      tick.classList.add("small");
    }

    rulerScale.appendChild(tick);
  }
}

function showProblem() {
  const problem = problems[problemIndex];

  problemNumber.textContent =
    numberMarks[problemIndex] || String(problemIndex + 1);

  tapeA.style.width = (problem.a * pixelsPerCm) + "px";
  tapeB.style.width = (problem.b * pixelsPerCm) + "px";

  clearInputs();
  resetRulerPosition();
}

function clearInputs() {
  const inputs = [
    measureA,
    measureB,
    calcA,
    calcB,
    calcAnswer
  ];

  inputs.forEach(function(input) {
    input.value = "";
    input.classList.remove("correct-input", "wrong-input");
  });

  result.textContent = "";
  result.className = "result";
}

function resetRulerPosition() {
  ruler.style.left = "90px";
  ruler.style.top = "48px";
}

function setInputResult(input, isCorrect) {
  input.classList.remove("correct-input", "wrong-input");

  if (isCorrect) {
    input.classList.add("correct-input");
  } else {
    input.classList.add("wrong-input");
  }
}

function checkAnswers() {
  const problem = problems[problemIndex];

  const enteredMeasureA = Number(measureA.value);
  const enteredMeasureB = Number(measureB.value);
  const enteredCalcA = Number(calcA.value);
  const enteredCalcB = Number(calcB.value);
  const enteredAnswer = Number(calcAnswer.value);

  const allFilled = [
    measureA,
    measureB,
    calcA,
    calcB,
    calcAnswer
  ].every(function(input) {
    return input.value.trim() !== "";
  });

  if (!allFilled) {
    result.textContent =
      "まだ書いていないところがあります。";

    result.className = "result error-message";
    return;
  }

  const answerAOk = enteredMeasureA === problem.a;
  const answerBOk = enteredMeasureB === problem.b;

  const calcAOk = enteredCalcA === problem.a;
  const calcBOk = enteredCalcB === problem.b;
  const totalOk =
    enteredAnswer === problem.a + problem.b;

  setInputResult(measureA, answerAOk);
  setInputResult(measureB, answerBOk);
  setInputResult(calcA, calcAOk);
  setInputResult(calcB, calcBOk);
  setInputResult(calcAnswer, totalOk);

  if (
    answerAOk &&
    answerBOk &&
    calcAOk &&
    calcBOk &&
    totalOk
  ) {
    result.textContent =
      "せいかい！　じょうずにはかれました！";

    result.className = "result correct-message";

  } else {
    result.textContent =
      "赤いところを、もういちど見なおしましょう。";

    result.className = "result error-message";
  }
}

function nextProblem() {
  problemIndex++;

  if (problemIndex >= problems.length) {
    problemIndex = 0;
  }

  showProblem();
}

function applyCalibration() {
  pixelsPerCm = Number(calibrationSlider.value);

  localStorage.setItem(
    "tapePixelsPerCm",
    String(pixelsPerCm)
  );

  createRuler();
  showProblem();

  calibrationScreen.classList.remove("show");
}

function openCalibration() {
  calibrationSlider.value = String(pixelsPerCm);
  updateCalibrationLine();
  calibrationScreen.classList.add("show");
}

let dragging = false;
let pointerOffsetX = 0;
let pointerOffsetY = 0;

ruler.addEventListener("pointerdown", function(event) {
  dragging = true;
  ruler.classList.add("dragging");

  const rulerRect = ruler.getBoundingClientRect();

  pointerOffsetX = event.clientX - rulerRect.left;
  pointerOffsetY = event.clientY - rulerRect.top;

  ruler.setPointerCapture(event.pointerId);
  event.preventDefault();
});

ruler.addEventListener("pointermove", function(event) {
  if (!dragging) {
    return;
  }

  const areaRect = rulerArea.getBoundingClientRect();
  const rulerRect = ruler.getBoundingClientRect();

  let newLeft =
    event.clientX - areaRect.left - pointerOffsetX;

  let newTop =
    event.clientY - areaRect.top - pointerOffsetY;

  const minimumLeft =
    Math.min(0, areaRect.width - rulerRect.width);

  const maximumLeft =
    Math.max(0, areaRect.width - rulerRect.width);

  const minimumTop = 0;
  const maximumTop =
    Math.max(0, areaRect.height - rulerRect.height);

  newLeft = Math.min(
    maximumLeft,
    Math.max(minimumLeft, newLeft)
  );

  newTop = Math.min(
    maximumTop,
    Math.max(minimumTop, newTop)
  );

  ruler.style.left = newLeft + "px";
  ruler.style.top = newTop + "px";

  event.preventDefault();
});

function stopDragging(event) {
  if (!dragging) {
    return;
  }

  dragging = false;
  ruler.classList.remove("dragging");

  try {
    ruler.releasePointerCapture(event.pointerId);
  } catch (error) {
    // 何もしない
  }
}

ruler.addEventListener("pointerup", stopDragging);
ruler.addEventListener("pointercancel", stopDragging);

measureA.addEventListener("input", function() {
  calcA.value = measureA.value;
});

measureB.addEventListener("input", function() {
  calcB.value = measureB.value;
});

[
  measureA,
  measureB,
  calcA,
  calcB,
  calcAnswer
].forEach(function(input) {
  input.addEventListener("input", function() {
    input.classList.remove("correct-input", "wrong-input");
    result.textContent = "";
  });
});

document
  .getElementById("checkButton")
  .addEventListener("click", checkAnswers);

document
  .getElementById("nextButton")
  .addEventListener("click", nextProblem);

document
  .getElementById("resetRulerButton")
  .addEventListener("click", resetRulerPosition);

document
  .getElementById("calibrationOpenButton")
  .addEventListener("click", openCalibration);

calibrationSlider.addEventListener(
  "input",
  updateCalibrationLine
);

document
  .getElementById("calibrationDoneButton")
  .addEventListener("click", applyCalibration);

document.addEventListener(
  "dblclick",
  function(event) {
    event.preventDefault();
  },
  { passive: false }
);

document.addEventListener(
  "gesturestart",
  function(event) {
    event.preventDefault();
  },
  { passive: false }
);

calibrationSlider.value = String(pixelsPerCm);
updateCalibrationLine();
createRuler();
showProblem();
</script>
